name: Tests

# Runs the service test suites on every pull request that touches them.
#
# WHY THIS EXISTS
#
# It did not, and that is the finding. The repository had 61 assertions across
# four suites -- Telegram initData verification, KMS signature recovery, chain-id
# mismatch refusal, and request-body handling -- and NOTHING ran them. `npm run
# test:functions` was documented in the README as a local check, which means it
# ran when somebody remembered.
#
# The consequence was not hypothetical. A pull request that broke initData
# verification, or made the chain check stop refusing a mainnet RPC, or broke the
# KMS signer, would have gone green and merged, because the only workflows
# triggered by a pull request were db-migrate (paths db/**) and terraform (paths
# infra/**). A change confined to services/ triggered nothing at all.
#
# This is the same shape as verify.yml's own reason for existing: a control that
# exists, is well written, and is never exercised. These tests were written
# carefully -- chain.test.mjs runs a real HTTP server rather than stubbing fetch,
# precisely so it cannot pass against code that could not parse a real response
# -- and then left unwired.
#
# NEEDS NO AWS AND NO SECRETS. There is nothing to gate, no OIDC role to assume,
# and no reason for this not to run on every pull request from anyone.

on:
  pull_request:
    paths:
      - 'services/**'
      - 'scripts/**'
      - 'stress-test/**'
      - 'src/**'
      - 'db/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'scripts/**'
      - 'stress-test/**'
      - 'src/**'
      - 'db/**'
      - 'supabase/migrations/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

# Read-only. This job builds nothing and deploys nothing.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: functions service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services/functions/package-lock.json

      # `npm ci` rather than `npm install`, so a lockfile that has drifted from
      # package.json fails here instead of resolving to something different from
      # what the Dockerfile will install.
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: services/functions

      - name: Test
        run: npm test
        working-directory: services/functions

      # A GATE. See services/functions/tsconfig.json for why this exists: ~2,000
      # lines of JavaScript that verify HMACs, mint sessions, spend stakes and
      # sign BSC transactions were checked by nothing, while the 7,900-line
      # TypeScript Mini App in front of them was fully typechecked. The risk was
      # inverted.
      #
      # It landed advisory, with six findings. All six are now cleared, so it is a
      # gate -- which costs nothing today and means the next one is caught at the
      # pull request rather than found by pointing a tool at this service months
      # from now.
      #
      # Four of the six traced to a single un-annotated line: `hex()` returned a
      # template literal, which TypeScript infers as plain `string`, so `r` and
      # `s` reached viem's serializeTransaction as `string` where its types demand
      # `0x${string}`.
      - name: typecheck
        run: npx tsc -p tsconfig.json
        working-directory: services/functions

      # A GATE, AT `low`, AND IT IS CLEAN TODAY.
      #
      # Nothing scanned dependencies until now. Trivy runs in terraform.yml and
      # covers IaC misconfiguration and committed secrets -- not packages -- so a
      # known-vulnerable transitive dependency could reach the container that
      # verifies HMACs, mints sessions and signs BSC transactions with nothing
      # objecting.
      #
      # `low` rather than `high` because this tree is SMALL and clean: express,
      # jsonwebtoken, pg, @aws-sdk/client-kms, viem. There is no backlog to
      # tolerate, so the threshold that catches the most is also the one that
      # blocks nothing -- and a gate set at the level you are already at is the
      # only kind that stays meaningful.
      #
      # --omit=dev is deliberately ABSENT. The Dockerfile installs with
      # --omit=dev, but a compromised build-time dependency is a supply-chain
      # problem for the image regardless of whether it ships inside it.
      - name: audit dependencies
        run: npm audit --audit-level=low
        working-directory: services/functions

  ticker:
    name: ticker service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services/ticker/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: services/ticker

      # The ticker has no test suite yet. This asserts the entry point at least
      # PARSES, which is not nothing: it is the process that calls game_tick()
      # once a second, and a syntax error in it stops the game with no HTTP
      # endpoint failing to make it obvious.
      #
      # --check rather than running it, because running it would try to reach a
      # database. When the ticker gains real tests, replace this with `npm test`.
      - name: Parse check
        run: node --check src/index.js
        working-directory: services/ticker

      # The ticker has no unit tests, so this is the only thing that inspects it
      # beyond "does it parse". It is the process that calls game_tick() once a
      # second; a wrong argument shape here stops the game.
      # Also a gate, and clean. The ticker has no unit tests, so beyond "does it
      # parse" this is the only thing inspecting the process that calls
      # game_tick() once a second.
      - name: typecheck
        run: npx tsc -p tsconfig.json
        working-directory: services/ticker

      # Same gate, same level, same reason as the functions service above. This
      # tree is two dependencies (pg and @aws-sdk/client-cloudwatch) and is
      # clean, so `low` costs nothing and catches everything.
      - name: audit dependencies
        run: npm audit --audit-level=low
        working-directory: services/ticker

  spa:
    name: Mini App types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      # A GATE, and the argument for it is that the build cannot do this job.
      #
      # `npm run build` does not typecheck -- vite strips types without checking
      # them -- so this step is the only thing between a ReferenceError and the
      # busiest player path. It has already caught a ReferenceError in GameRoom
      # that the build shipped happily, and a call to a function that does not
      # exist, in a change whose build passed, on the day it became a gate.
      #
      # IT WAS ADVISORY UNTIL 2026-08-13, deliberately, because it reported
      # findings on main and gating on a red main teaches people to ignore it.
      # That comment set the condition for promotion -- read each finding and
      # either wire it up or remove it on purpose -- and warned why blanket
      # suppression would be wrong: `onSpectateGame` was unused because spectator
      # mode was threaded from App.tsx and never invoked, so the compiler was
      # reporting a dead FEATURE rather than dead syntax. Deleting the prop to
      # satisfy it would have removed the hook for something somebody intended.
      #
      # That condition is now met. All eleven remaining findings were read: nine
      # were dead declarations, one was a seven-day revenue breakdown computed
      # and never rendered, and one was a missing loading indicator kept as a
      # comment because the submit button is guarded by different state.
      #
      # A GATE SINCE 2026-08-13, and the condition the comment above set has been
      # met: all eleven findings were read and each was wired up or removed on
      # purpose. Nine were dead declarations; one was a seven-day revenue panel
      # computed and never rendered; one was a missing loading indicator, kept as
      # a comment because the submit button is guarded by different state.
      #
      # Blocking matters more here than the findings did. `npm run build` does
      # not typecheck -- vite strips types without checking them -- so this is
      # the only thing standing between a ReferenceError and the busiest player
      # path. It has already caught a call to a function that does not exist,
      # in a change whose build passed, on the day this became a gate.
      - name: typecheck
        run: npm run typecheck

      # LINT, GATING ON ERRORS.
      #
      # Nothing ran `npm run lint` in CI at all, which HANDOVER listed as an open
      # gap. It catches a different class from typecheck -- an empty destructuring
      # pattern, a bad hook dependency, an unused local -- and it found one of
      # each on the day it was added, including an empty pattern introduced hours
      # earlier by removing an unused prop.
      #
      # `@typescript-eslint/no-explicit-any` is a WARNING rather than an error,
      # deliberately, and eslint.config.js explains why: 23 exist, all in generic
      # plumbing, and retyping them blind to make a new gate green would be
      # changing working code for the gate's benefit. They still print.
      #
      # supabase/functions is excluded -- inherited Deno source that has never
      # run in this deployment. See eslint.config.js.
      - name: lint
        run: npm run lint

      # TWO THRESHOLDS, AND THE SPLIT IS THE HONEST PART.
      #
      # Nothing scanned dependencies until now. Trivy in terraform.yml covers IaC
      # and committed secrets, not packages. The first run of this found 13
      # vulnerabilities in production dependencies, 6 of them high; `npm audit
      # fix` cleared 11 with no breaking change and no effect on typecheck, lint
      # or the build.
      #
      # ONE HIGH REMAINS and cannot be fixed from here:
      #
      #   @reown/appkit-adapter-wagmi -> @base-org/account -> @coinbase/cdp-sdk
      #     -> @solana/web3.js -> jayson -> uuid  (GHSA-w5hq-g745-h8pq)
      #
      # It is six levels down a direct dependency, so clearing it needs an
      # upstream release, not a lockfile edit. It is also in the DEFERRED crypto
      # stack: src/lib/features.ts gates every wallet surface behind
      # VITE_CRYPTO_ENABLED, which is false, and the chunk is dynamically
      # imported so it is not fetched at all.
      #
      # So `critical` is the GATE -- clean today, blocks nothing, and catches
      # anything genuinely severe -- and `high` runs ADVISORY so the count stays
      # visible instead of being silently tolerated.
      #
      # PROMOTE THE ADVISORY TO A GATE when either becomes true:
      #   * @reown/appkit ships a fix, and the high count reaches zero
      #   * VITE_CRYPTO_ENABLED is set to true for any environment -- at which
      #     point that dependency is live in a browser handling wallets, and
      #     "it is behind a flag" stops being an argument
      # A GATE, and the first test the Mini App has ever had.
      #
      # Lobby.tsx, GameRoom.tsx and Admin.tsx are 3,266 lines that display and
      # spend player money, and typecheck plus lint were the only things
      # inspecting any of it. Those catch shapes, not decisions.
      #
      # What this covers is the decisions, in the functions that make them:
      # checkWin -- which decides whether a player is offered the claim button
      # that leads to a payout -- and formatBirr, which renders every balance a
      # player sees. See src/utils/bingoUtils.test.ts for why testing these
      # beats rendering the components.
      #
      # tsx rather than vitest, deliberately: tsx is already a devDependency for
      # the stress-test scripts, so this adds a test runner without adding a
      # dependency, a config file or jsdom.
      - name: test the Mini App logic
        run: npm run test:app

      - name: audit dependencies (gate)
        run: npm audit --omit=dev --audit-level=critical

      - name: audit dependencies (advisory)
        continue-on-error: true
        run: |
          echo "Advisory. See the comment in .github/workflows/test.yml for the"
          echo "one known high and the two conditions for making this a gate."
          npm audit --omit=dev --audit-level=high

  migrations:
    name: migration contract
    runs-on: ubuntu-latest

    # NO `services:` BLOCK, deliberately, and it is what unblocked the game loop.
    #
    # This used to start a stock postgres:16 here and hand the script a
    # DATABASE_URL. Two problems, and the second is the one that mattered:
    #
    #   1. CI and a developer's machine ran different servers, so "works locally"
    #      and "passes CI" were genuinely different claims.
    #   2. GitHub Actions cannot pass server arguments to a service container --
    #      there is no `command`, and `options` maps to `docker create`. So
    #      shared_preload_libraries=pg_cron could NEVER be set here, which is
    #      exactly why db/20-post/001 and 002 were skipped, which is exactly why
    #      game_tick() had no test.
    #
    # scripts/test-migrations.sh builds db/test/Dockerfile and runs it itself,
    # with the flags. Docker is present on the runner and the script picks it up.
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A HARD GATE, unlike the advisory checks in this file, and it is clean
      # today so turning it on blocks nothing.
      #
      # It catches one bug class: a function ending the migration set with more
      # than one live signature. `CREATE OR REPLACE FUNCTION` only replaces a
      # MATCHING signature, so changing the parameter list creates an OVERLOAD and
      # leaves the old body callable.
      #
      # That has cost this project three times, most expensively when
      # db/20-post/004 rewrote get_lobby_data_instant to take identity from the
      # JWT while a surviving one-argument version kept trusting the request body
      # -- a security fix that would have shipped bypassable by omitting a field.
      # It was found by a migration FAILING against the real database, after
      # passing every local check there was.
      #
      # No database required, so it runs in milliseconds on every pull request
      # that touches a migration.
      - name: No function ends up with two signatures
        run: node scripts/check-migrations.mjs

      # ACTUALLY RUNS THE SQL, which nothing did until now.
      #
      # db-migrate.yml's pull-request job runs `db-migrate.sh --dry-run`, which
      # prints filenames and continues -- it never executes them -- and the static
      # check above only reads CREATE/DROP statements. Both reported success on a
      # pull request adding two migrations without either being run. A syntax
      # error, an unsatisfiable constraint or a failing assertion would have
      # merged green, and the only thing standing in the way was somebody
      # remembering to run psql by hand.
      #
      # Applies ALL of db/20-post against db/test/fixture.sql, TWICE -- these
      # files are repeatable, so one that only works against a clean database is
      # broken in a way a single pass cannot see -- and then DRIVES game_tick()
      # through a full round and asserts what it did.
      #
      # 001 and 002 are no longer skipped. They assert wal_level=logical and
      # pg_cron, which the image built from db/test/Dockerfile provides.
      #
      # Does NOT cover db/00-bootstrap or the 104 inherited migrations: the
      # fixture is production-SHAPED, not production. A column that exists there
      # and not here is still only caught by the run against dev.
      #
      # No DATABASE_URL: the script builds and runs its own server. See the
      # comment on the missing `services:` block above.
      - name: Migrations apply, and the game loop behaves
        run: ./scripts/test-migrations.sh

  scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nothing watched scripts/ until now, which is how a 500-line bash file
      # that bootstraps IAM roles, tunnels to the database and writes bucket
      # policies came to have no gate on it at all. A pull request touching only
      # scripts/ ran zero checks.
      #
      # These scripts are not incidental: db-migrate.sh applies schema changes to
      # the database holding player balances, bootstrap-aws.sh creates the roles
      # everything else authenticates with, and probe-public-access.sh is one of
      # the three controls verify.yml relies on. A syntax error in any of them
      # fails at the least convenient moment.
      - name: Syntax
        run: |
          set -euo pipefail
          fail=0
          for f in scripts/*.sh stress-test/*.sh; do
            [ -f "$f" ] || continue
            if bash -n "$f"; then
              echo "  ok    $f"
            else
              echo "::error file=$f::bash -n failed"
              fail=1
            fi
          done
          exit $fail

      # shellcheck is preinstalled on ubuntu-latest runners, so this costs
      # nothing to run.
      #
      # NOT a gate yet, deliberately. These scripts predate it and shellcheck
      # will have opinions about all of them; turning it into a hard failure in
      # the same change that introduces it would either block unrelated work or
      # invite a sweep of unreviewed edits across files that move money. It
      # reports, visibly, and can be promoted to a gate once the existing
      # findings have been read and either fixed or explicitly ignored.
      - name: shellcheck (advisory)
        continue-on-error: true
        run: |
          shellcheck --version
          shellcheck --severity=warning scripts/*.sh stress-test/*.sh || \
            echo "::warning::shellcheck reported findings. Advisory for now -- see the workflow comment."
