name: Generate Cloudflare import blocks

# Adopts the DNS records that already exist, so Terraform manages the REAL ones.
#
# WHY THIS IS NOT JUST "TERRAFORM APPLY"
#
# api.<domain> and rt.<domain> are live and proxied. Applying modules/cloudflare
# without importing them would not fail, and that is exactly the problem:
# Cloudflare permits several A records on one name (round-robin), so Terraform
# would CREATE A SECOND record beside each existing one. The site would keep
# working -- both point at the same origin -- while Terraform managed a record
# nobody uses and the real one stayed editable in the dashboard, unmanaged and
# invisible to every future plan.
#
# A clean plan describing the wrong object is worse than no plan at all.
#
# WHY A WORKFLOW RATHER THAN A LOCAL SCRIPT
#
# The generator needs the Cloudflare API token. That token is a GitHub Secret,
# which is where it should stay -- running this in CI means nobody has to hold a
# copy locally or paste it into a shell. Same reason ami-bump.yml runs here.
#
# Read-only against Cloudflare: it lists records and changes nothing. The output
# is a pull request you review before anything is adopted.
#
# ONE-TIME. Delete the generated file after the apply -- an import block is an
# instruction to adopt an existing object, not a description of desired state.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment whose root gets the import blocks'
        required: true
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cloudflare-import
  cancel-in-progress: false

jobs:
  generate:
    name: Generate imports for ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    # DECLARED, AND IT WAS NOT UNTIL 2026-08-12.
    #
    # This job took an `environment` INPUT, named itself after it, and wrote
    # into infra/environments/<input>/ -- while never declaring `environment:`.
    # Environment-scoped variables and secrets are only resolved for a job that
    # declares one, so vars.CLOUDFLARE_ZONE_ID silently fell back to the
    # REPOSITORY value no matter which environment was selected.
    #
    # Harmless while both environments shared a zone. The moment they stopped,
    # dispatching this for prod read DEV's zone and would have written dev's
    # records into environments/prod/cloudflare-imports.tf as prod's -- import
    # blocks adopting the wrong zone's DNS into prod's state.
    #
    # Caught by using this as a read-only test of whether the Cloudflare token
    # could reach the new zone. It answered about the old one, which is a more
    # useful failure than the test succeeding would have been.
    #
    # modules/iam records the same shape for db-migrate.yml and verify.yml,
    # where it was worse -- those build a role ARN from an input, so an
    # undeclared environment reached prod with nobody asked to approve. This one
    # touches no AWS role, so it was only ever wrong rather than dangerous.
    environment: ${{ github.event.inputs.environment }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare is configured
        env:
          ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$ZONE_ID" ]; then
            echo "::error::CLOUDFLARE_ZONE_ID is not set. gh variable set CLOUDFLARE_ZONE_ID --body '<id>'"
            exit 1
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. gh secret set CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Generate the import blocks
        id: gen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          # NOT vars.DOMAIN_NAME. Since the environments split domains, the
          # domain is a property of the ROOT -- environments/<env>/variables.tf
          # -- and CI no longer passes it to Terraform at all. A repository
          # variable here would name one domain while CLOUDFLARE_ZONE_ID named
          # the other zone, which is exactly what this probe caught: it read the
          # bingonova zone looking for api.yisakmesifin.org, found nothing, and
          # reported "Terraform will CREATE it" about the wrong hostname.
          #
          # Read from the root so the two cannot disagree.
        run: |
          set -euo pipefail

          # awk RANGE, not `grep -A<n>`. The first attempt used -A20 and
          # returned empty for dev, whose domain_name carries a long heredoc
          # description that pushes `default` past twenty lines -- so it would
          # have failed for one environment and worked for the other, which is
          # the worst way for a parser to be wrong.
          DOMAIN_NAME="$(awk '/^variable "domain_name"/,/^}/' \
            "infra/environments/${ENVIRONMENT}/variables.tf" \
            | grep -m1 -E '^\s*default' | sed 's/.*= *"//; s/".*//')"
          [ -n "$DOMAIN_NAME" ] || {
            echo "::error::Could not read domain_name from infra/environments/${ENVIRONMENT}/variables.tf"; exit 1; }
          export DOMAIN_NAME
          echo "domain for ${ENVIRONMENT}: ${DOMAIN_NAME}"
          OUT="infra/environments/${ENVIRONMENT}/cloudflare-imports.tf"

          # stderr carries the progress and warnings; stdout is the file.
          ./scripts/cloudflare-import.sh "$ENVIRONMENT" > "$OUT"

          echo "file=$OUT" >> "$GITHUB_OUTPUT"

          # A file containing only the header comment means nothing was found to
          # adopt, which is a legitimate outcome (a brand-new zone) but should
          # not produce a pull request.
          if ! grep -q '^import {' "$OUT"; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No existing records to adopt." >> "$GITHUB_STEP_SUMMARY"
            rm -f "$OUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Import blocks generated"
            echo
            echo '```terraform'
            cat "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: hashicorp/setup-terraform@v3
        if: steps.gen.outputs.found == 'true'
        with:
          terraform_version: '1.15.8'

      # Catch a malformed generated file here rather than in the PR's plan.
      - name: Validate the edited configuration
        if: steps.gen.outputs.found == 'true'
        run: |
          set -euo pipefail
          terraform fmt -check "${{ steps.gen.outputs.file }}"
          terraform -chdir="infra/environments/${ENVIRONMENT}" init -backend=false -input=false > /dev/null
          terraform -chdir="infra/environments/${ENVIRONMENT}" validate

      - name: Open the pull request
        if: steps.gen.outputs.found == 'true'
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/cloudflare-import-${{ github.event.inputs.environment }}
          base: main
          commit-message: "Adopt the existing Cloudflare DNS records for ${{ github.event.inputs.environment }}"
          title: "Adopt existing Cloudflare DNS records (${{ github.event.inputs.environment }})"
          labels: automation
          delete-branch: true
          body: |
            Generated by `cloudflare-import.yml` against the live zone.

            `api.` and `rt.` already exist and are proxied. Without these import
            blocks Terraform would **create a second A record beside each one** --
            Cloudflare allows several A records on a name, so this fails silently
            rather than loudly. Terraform would then manage a record nobody uses
            while the real one stayed editable in the dashboard.

            **After this merges and applies, delete the generated file.** An
            import block is a one-time instruction, not desired state, and
            leaving it in makes every later plan re-check an import that already
            happened.

            Check the plan on this PR shows the records being **imported**, not
            created. If it says `will be created`, do not apply — the record IDs
            are wrong and applying would produce the duplicates this exists to
            prevent.

      # `create-pull-request` fails outright when the repository has not enabled
      # "Allow GitHub Actions to create and approve pull requests", which is OFF
      # by default. The branch is pushed BEFORE that step fails, so nothing is
      # lost -- but the run goes red and the reason is a permissions message that
      # looks like a bug in this workflow rather than a repository setting.
      #
      # continue-on-error above, plus this step, turns that into a link. The work
      # is still done; opening the pull request becomes one click instead of a
      # failed run somebody has to investigate.
      - name: Report if the pull request could not be opened
        if: steps.pr.outcome == 'failure'
        run: |
          BRANCH="automation/cloudflare-import-${{ github.event.inputs.environment }}"
          URL="${{ github.server_url }}/${{ github.repository }}/compare/main...${BRANCH}?expand=1"
          {
            echo "### Branch pushed, pull request not opened"
            echo
            echo "GitHub Actions is not permitted to create pull requests in this"
            echo "repository, so the final step could not run. **The branch was"
            echo "pushed and the work is intact.**"
            echo
            echo "Open it here: ${URL}"
            echo
            echo "To let this workflow finish on its own in future: Settings >"
            echo "Actions > General > Workflow permissions > *Allow GitHub Actions"
            echo "to create and approve pull requests*."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Branch pushed but PR not opened -- see the run summary for the link."
