name: Deploy services

# Builds a container image, pushes it to ECR tagged by git SHA, records it as the
# service's image pointer in SSM, and rolls the ECS service onto it.
#
# Images are tagged by COMMIT SHA, never :latest. The ECR repositories are
# IMMUTABLE, so a tag can never be repointed at different bytes: whatever is
# running is always traceable to a commit, and a rollback is re-deploying an
# older SHA rather than rebuilding and hoping.
#
# Build is arm64 to match the Graviton (t4g.small) instance. An x86 image will
# push happily and then fail at runtime with "exec format error", which is a
# confusing way to learn about architecture.
#
# TWO THINGS THIS USED TO LEAVE TO A HUMAN, AND NO LONGER DOES
#
# 1. The image pointer. Deploying a service that Terraform had not created
#    printed a warning telling you to run `gh variable set <SVC>_IMAGE` and then
#    re-dispatch the Terraform workflow. That is two manual steps in the middle
#    of an otherwise automated pipeline, and the failure mode when you forget is
#    a service quietly running last week's build. The pointer now goes to SSM at
#    /fanosbingo-<env>/images/<service>, which Terraform reads.
#
# 2. The follow-up apply. When the service does not exist yet, this workflow now
#    dispatches the Terraform workflow itself rather than telling you to.
#
# CREDENTIALS
#
# This assumes fanosbingo-<env>-github-deploy, NOT the AdministratorAccess
# Terraform executor. That role exists precisely for this: ECR push scoped to
# this project's repositories, ECS deploy, PassRole restricted to the task roles,
# and SSM write scoped to the image pointers. Building an image is not a reason
# to hold admin over the account.

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build and deploy'
        required: true
        type: choice
        options: [ticker, postgrest, realtime, functions, caddy]
        default: ticker
      environment:
        description: 'Environment'
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      deploy:
        description: 'Roll the ECS service after pushing (uncheck to build only)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  # Lets this workflow dispatch terraform.yml when the service does not exist
  # yet, instead of printing instructions for a human to follow.
  actions: write

jobs:
  build:
    name: ${{ github.event.inputs.service }} -> ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    concurrency:
      group: deploy-${{ github.event.inputs.environment }}-${{ github.event.inputs.service }}
      cancel-in-progress: false
    env:
      SERVICE: ${{ github.event.inputs.service }}
      ENVIRONMENT: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      # An unset AWS_ACCOUNT_ID builds "arn:aws:iam:::role/...", which
      # configure-aws-credentials retries against for ninety seconds before
      # reporting "Request ARN is invalid" -- a message that points at the ARN
      # rather than at the variable that is missing. Fail in two seconds instead,
      # and say what to run.
      - name: Check the repository is bootstrapped
        env:
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::AWS_ACCOUNT_ID is not set, so the deploy role ARN cannot be built. Run ./scripts/bootstrap-github.sh."
            exit 1
          fi

      # The scoped deploy role, derived from the account id rather than stored
      # per environment: the name is deterministic, so there is no variable to
      # set and nothing to keep in sync when an environment is rebuilt.
      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/fanosbingo-${{ github.event.inputs.environment }}-github-deploy
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}

      - name: Log in to ECR
        id: ecr
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "repository=${REGISTRY}/fanosbingo-${ENVIRONMENT}/${SERVICE}" >> "$GITHUB_OUTPUT"

      # Run the service's own tests BEFORE building an image from it.
      #
      # This gate did not exist, and neither did any pull-request check that ran
      # them (see .github/workflows/test.yml). So a service whose test suite
      # failed could be built, pushed, pointed at by SSM and rolled out, and
      # nothing anywhere would have objected. For `functions` that suite is what
      # asserts initData verification rejects a forgery, that a mainnet RPC is
      # REFUSED when the environment is configured for testnet, and that KMS
      # signatures recover to the address we expect -- none of which fail loudly
      # at runtime if they regress.
      #
      # Seconds to run, no AWS, no secrets. There is no argument for shipping
      # without it.
      #
      # Only for services that HAVE a suite. Checked with a glob rather than a
      # hardcoded list, so a suite added to the ticker starts gating its deploys
      # without anybody remembering to edit this.
      # Unconditional, and there is a SECOND setup-node further down guarded by
      # `service == 'caddy'`. That is deliberate, not a leftover: this one gives
      # every service a Node to run its tests with, and the caddy one sets up the
      # npm cache keyed on the ROOT lockfile for the Mini App build. setup-node
      # is idempotent, so running it twice costs a few seconds and removing
      # either one breaks something.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test the service before building it
        env:
          SERVICE: ${{ github.event.inputs.service }}
        run: |
          set -euo pipefail

          dir="services/${SERVICE}"

          if [ ! -f "$dir/package.json" ]; then
            echo "No package.json in $dir; nothing to test (postgrest, realtime and caddy are upstream images)."
            exit 0
          fi

          if ! ls "$dir"/src/*.test.mjs >/dev/null 2>&1; then
            echo "::warning::${SERVICE} has no test suite. Building unverified."
            exit 0
          fi

          npm --prefix "$dir" ci --no-audit --no-fund
          npm --prefix "$dir" test

      # QEMU so an x86 runner can build arm64. Slower than a native arm64
      # runner, but free on private repositories.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      # The Mini App is baked into the Caddy image, so it is built here first --
      # natively on the runner, because a vite build under QEMU arm64 is
      # needlessly slow, and the output is static either way.
      #
      # VITE_ variables are COMPILE-TIME: whatever is set here is inlined into
      # the bundle and shipped to every browser. Nothing secret belongs in them,
      # and the anon key is public by design.
      - uses: actions/setup-node@v4
        if: github.event.inputs.service == 'caddy'
        with:
          node-version: '22'
          cache: 'npm'

      # THE API URL COMES FROM THIS ENVIRONMENT'S SSM, NOT A SHARED VARIABLE.
      #
      # VITE_ values are COMPILE-TIME, so whatever is set here is inlined into
      # the bundle and served to every player. vars.DOMAIN_NAME was a single
      # repository variable, which was harmless only while both environments
      # served the same domain. They no longer do -- prod is bingonova.org and
      # dev is yisakmesifin.org -- so building either from a shared variable
      # bakes ONE environment's API into the OTHER's bundle. The app would load
      # and every call would be cross-origin to a host that refuses it.
      #
      # /fanosbingo-<env>/app/api_base_url is written by modules/ssm from that
      # root's domain_name, so it cannot drift from what Caddy actually serves.
      # Same source the chain id already uses below.
      - name: Resolve this environment's API origin
        if: github.event.inputs.service == 'caddy'
        run: |
          set -euo pipefail
          API="$(aws ssm get-parameter \
            --name "/fanosbingo-${ENVIRONMENT}/app/api_base_url" \
            --query 'Parameter.Value' --output text)"
          case "$API" in
            https://api.*) : ;;
            *) echo "::error::api_base_url for ${ENVIRONMENT} is '${API}', which is not an https api host. Refusing to bake it into the bundle."; exit 1 ;;
          esac
          echo "API_ORIGIN=$API" >> "$GITHUB_ENV"
          echo "building the Mini App against ${API}"

      - name: Build the Mini App
        if: github.event.inputs.service == 'caddy'
        env:
          VITE_SUPABASE_URL: ${{ env.API_ORIGIN }}
          VITE_API_BASE_URL: ${{ env.API_ORIGIN }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SPA_ANON_KEY }}
          VITE_REOWN_PROJECT_ID: ${{ vars.REOWN_PROJECT_ID }}

          # The bot whose Login Widget signs a WEB session, so the admin panel
          # opens in a browser. Not secret -- a bot username is public. What
          # gates the widget is BotFather /setdomain naming this origin.
          #
          # Unset is legitimate: the login button does not render and the Mini
          # App is unaffected, which is the right failure for a build made
          # before the domain has been claimed.
          VITE_TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
        run: |
          set -euo pipefail

          # THE CHAIN THIS BUNDLE WILL TALK TO, read from the SAME SSM parameter
          # Terraform writes and the functions service verifies against the RPC at
          # boot. Not a GitHub variable, which would be a fourth place to disagree.
          #
          # src/lib/walletConfig.ts used to hardcode viem's `bsc` -- chain 56,
          # MAINNET -- in every build including dev, while everything server-side
          # in dev is testnet 97. Deploying the contract to 97 and handing a
          # mainnet-connected wallet its address would have sent real BNB to an
          # address that holds no code and whose key nobody has.
          VITE_BSC_CHAIN_ID="$(aws ssm get-parameter \
            --name "/fanosbingo-${ENVIRONMENT}/bsc/chain_id" \
            --query 'Parameter.Value' --output text)"
          export VITE_BSC_CHAIN_ID

          case "${VITE_BSC_CHAIN_ID}" in
            56|97) : ;;
            *)
              echo "::error::/fanosbingo-${ENVIRONMENT}/bsc/chain_id is '${VITE_BSC_CHAIN_ID}', expected 56 or 97."
              exit 1
              ;;
          esac

          # Refuse to build a MAINNET bundle for dev by accident. dev is testnet by
          # construction -- AGENTS.md states nothing there should ever touch
          # mainnet funds -- so this combination is a misconfiguration, not a
          # choice.
          if [ "${ENVIRONMENT}" = "dev" ] && [ "${VITE_BSC_CHAIN_ID}" = "56" ]; then
            echo "::error::dev is configured for BSC MAINNET (56). Refusing to build."
            exit 1
          fi

          echo "Building for BSC chain ${VITE_BSC_CHAIN_ID} ($([ "${VITE_BSC_CHAIN_ID}" = "56" ] && echo mainnet || echo testnet))"

          # THE DEPOSIT CONTRACT, from the same place: SSM, written by
          # scripts/deploy-contract.mjs when it deploys.
          #
          # The modals used to read settings.deposit_contract_address at runtime,
          # which deploy-contract.mjs does NOT write -- it says so in its own
          # output ("settings.deposit_contract_address still holds the OLD
          # value"). And nothing else can write it either: only service_role has a
          # write policy on settings, and /functions/v1/update-settings is a 404.
          # So the address the app showed could only ever be changed by hand, in
          # the database, by someone who knew to.
          #
          # Absent is normal and not an error -- the contract is not deployed yet.
          # The bundle then carries an empty address and the modals refuse to
          # start a deposit, which is the correct behaviour for "there is nowhere
          # to deposit to".
          VITE_DEPOSIT_CONTRACT_ADDRESS="$(aws ssm get-parameter \
            --name "/fanosbingo-${ENVIRONMENT}/bsc/deposit_contract_address" \
            --query 'Parameter.Value' --output text 2>/dev/null || echo '')"
          export VITE_DEPOSIT_CONTRACT_ADDRESS

          if [ -n "${VITE_DEPOSIT_CONTRACT_ADDRESS}" ] && \
             ! printf '%s' "${VITE_DEPOSIT_CONTRACT_ADDRESS}" | grep -qE '^0x[0-9a-fA-F]{40}$'; then
            echo "::error::deposit_contract_address is not an address: ${VITE_DEPOSIT_CONTRACT_ADDRESS}"
            exit 1
          fi

          if [ -z "${VITE_DEPOSIT_CONTRACT_ADDRESS}" ]; then
            echo "::warning::No deposit contract published yet. Deposits will be disabled in this build."
          else
            echo "Deposit contract: ${VITE_DEPOSIT_CONTRACT_ADDRESS}"
          fi

          # Check the SHAPE, not just emptiness.
          #
          # "is it set" passes for a value like "<the token it printed>", which
          # is what happens when someone copies an instruction rather than its
          # result. The build then succeeds, ships, and every request to
          # PostgREST 401s -- a broken deployment that looks like a green run.
          #
          # A JWT is three base64url segments separated by dots, and this one
          # must carry role=anon or PostgREST will not treat it as the anon key.
          if [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "::error::SPA_ANON_KEY is not set. Set it with:"
            echo "::error::  gh variable set SPA_ANON_KEY --body \"\$(node scripts/mint-anon-key.mjs ${ENVIRONMENT} | grep -E '^eyJ')\""
            exit 1
          fi

          if ! printf '%s' "${VITE_SUPABASE_ANON_KEY}" | grep -qE '^eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'; then
            echo "::error::SPA_ANON_KEY is not a JWT. It currently starts with: $(printf '%s' "${VITE_SUPABASE_ANON_KEY}" | head -c 20)..."
            echo "::error::Set it to the SCRIPT OUTPUT, not to a description of it:"
            echo "::error::  gh variable set SPA_ANON_KEY --body \"\$(node scripts/mint-anon-key.mjs ${ENVIRONMENT} | grep -E '^eyJ')\""
            exit 1
          fi

          # Decode the payload and confirm the role. A JWT signed for a
          # different role would be structurally valid and functionally useless.
          ROLE="$(printf '%s' "${VITE_SUPABASE_ANON_KEY}" | cut -d. -f2 \
            | tr '_-' '/+' | base64 -d 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("role",""))' 2>/dev/null || echo "")"

          if [ "$ROLE" != "anon" ]; then
            echo "::error::SPA_ANON_KEY carries role='${ROLE}', expected 'anon'. PostgREST decides permissions from this claim."
            exit 1
          fi

          echo "SPA_ANON_KEY validated: a JWT with role=anon"

          npm ci --no-audit --no-fund
          npx vite build --outDir services/caddy/public --emptyOutDir

          echo "Built $(find services/caddy/public -type f | wc -l) files"

          # A bundle still naming supabase.co would mean the environment did not
          # reach the build, and the app would fail at runtime against a host
          # that does not exist.
          if grep -rq "supabase\.co" services/caddy/public/assets 2>/dev/null; then
            echo "::error::the built bundle still references supabase.co"
            exit 1
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          # Repo root, so services share docker/rds-global-bundle.pem.
          context: .
          file: services/${{ github.event.inputs.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.repository }}:${{ github.sha }}
          # Cache layers in the registry so a source-only change does not
          # reinstall dependencies under QEMU every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Recorded BEFORE the rollout, deliberately. If the rollout fails, the
      # pointer still reflects the build that was meant to be running, and a
      # subsequent `terraform apply` converges to it rather than to whatever was
      # there before. The pointer is intent; the running task is state.
      - name: Record the image pointer
        if: github.event.inputs.deploy == 'true'
        id: pointer
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ecr.outputs.repository }}:${{ github.sha }}"

          aws ssm put-parameter \
            --name "/fanosbingo-${ENVIRONMENT}/images/${SERVICE}" \
            --type String \
            --value "$IMAGE" \
            --overwrite \
            --no-cli-pager > /dev/null

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Recorded /fanosbingo-${ENVIRONMENT}/images/${SERVICE} = $IMAGE"

      - name: Deploy
        if: github.event.inputs.deploy == 'true'
        id: deploy
        run: |
          set -euo pipefail
          CLUSTER="fanosbingo-${ENVIRONMENT}"
          FAMILY="fanosbingo-${ENVIRONMENT}-${SERVICE}"
          IMAGE="${{ steps.pointer.outputs.image }}"

          if ! aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
               --query 'services[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
            echo "Service '$SERVICE' does not exist in $CLUSTER yet."
            echo "The image pointer is recorded, so Terraform can now create it."
            echo "needs_terraform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "needs_terraform=false" >> "$GITHUB_OUTPUT"

          # Take the live task definition and swap only the image, so any change
          # Terraform has made to environment, secrets or logging is preserved.
          TASKDEF="$(aws ecs describe-task-definition --task-definition "$FAMILY" \
            --query 'taskDefinition' --output json)"

          # Write to a real file rather than piping to file:///dev/stdin: inside
          # a command substitution the CLI does not reliably see stdin, and the
          # symptom is a bare "Invalid JSON received" that looks like a jq bug.
          echo "$TASKDEF" | jq --arg IMAGE "$IMAGE" '
            .containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' > /tmp/taskdef.json

          jq -e . /tmp/taskdef.json > /dev/null || { echo "::error::Generated task definition is not valid JSON"; exit 1; }

          REVISION="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)"

          echo "Registered $REVISION"

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$REVISION" --query 'service.serviceName' --output text

          echo "Waiting for the service to stabilise"
          # The deployment circuit breaker rolls back a crash-looping image on
          # its own, so this either stabilises on the new revision or on the
          # previous good one. Either way it terminates rather than sitting at
          # IN_PROGRESS until the waiter's own timeout.
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

          # `wait services-stable` succeeds for a rolled-back deployment too --
          # the service is stable, just not on what we shipped. Check what is
          # actually running rather than trusting the waiter's silence.
          RUNNING="$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].taskDefinition' --output text)"

          if [ "$RUNNING" != "$REVISION" ]; then
            echo "::error::Deployment did not take. Expected $REVISION, service is running $RUNNING."
            echo "The circuit breaker most likely rolled back a failing image. Check the task logs:"
            echo "  aws logs tail /ecs/fanosbingo-${ENVIRONMENT} --since 15m --filter-pattern ${SERVICE}"
            exit 1
          fi

          {
            echo "### Deployed"
            echo
            echo "- service: \`$SERVICE\`"
            echo "- image: \`$IMAGE\`"
            echo "- revision: \`$REVISION\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The service did not exist. Rather than printing instructions, run the
      # thing the instructions would have said to run.
      #
      # Terraform reads the pointer written above and creates the service. This
      # is a dispatch rather than an inline apply because applies belong to one
      # workflow and one role -- keeping the admin credential in exactly one
      # place is the entire reason the deploy role is scoped.
      - name: Create the service via Terraform
        if: steps.deploy.outputs.needs_terraform == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run terraform.yml \
            --repo "${{ github.repository }}" \
            -f environment="${ENVIRONMENT}" \
            -f action=apply

          {
            echo "### Service created on the next apply"
            echo
            echo "\`${SERVICE}\` did not exist in \`fanosbingo-${ENVIRONMENT}\` yet."
            echo
            echo "- image pointer: \`${{ steps.pointer.outputs.image }}\`"
            echo "- dispatched \`terraform.yml\` (environment: \`${ENVIRONMENT}\`, action: \`apply\`)"
            echo
            echo "Watch it with \`gh run list --workflow=terraform.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report a build-only run
        if: github.event.inputs.deploy != 'true'
        run: |
          {
            echo "### Built, not deployed"
            echo
            echo "- image: \`${{ steps.ecr.outputs.repository }}:${{ github.sha }}\`"
            echo
            echo "The image pointer was NOT updated, so nothing will roll onto this build."
          } >> "$GITHUB_STEP_SUMMARY"
