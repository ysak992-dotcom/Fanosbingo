name: Verify controls

# Runs the three assertions that nothing else runs.
#
# WHY THIS EXISTS
#
# The repository had grown three verification scripts and executed one of them
# regularly. That is the same failure this project keeps finding: a control that
# exists, is well written, and is never exercised.
#
#   verify-detections.sh    ran only on an `account` apply -- which happens
#                           perhaps twice a year. A metric filter edited in the
#                           console, or an SNS subscription that lapsed, would
#                           not be noticed until the alarm failed to fire during
#                           an actual incident.
#
#   verify-cloudflare.sh    ran NOWHERE. It asserts Bot Fight Mode is off -- the
#                           one setting Terraform cannot enforce on the free
#                           plan, and the one whose failure mode is Telegram
#                           quietly disabling your webhook hours later.
#
#   probe-public-access.sh  ran only after a migration.
#
# All three are read-only. Weekly is the right cadence: often enough that drift
# is caught in days rather than during an incident, rare enough that a green run
# still means something.
#
# EVERY CHECK RUNS EVEN IF AN EARLIER ONE FAILS. A run that stops at the first
# failure tells you about one problem; this tells you about all of them, which
# matters when the cause is common to several.

on:
  schedule:
    # Mondays 07:00 UTC, an hour after the AMI check, so a Monday morning gives
    # one combined picture rather than two notifications.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to verify'
        required: true
        type: choice
        options: [prod, dev]
        default: prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: verify-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (${{ github.event.inputs.environment || 'prod' }})
    runs-on: ubuntu-latest

    # DECLARED, where it previously was not.
    #
    # This job builds a role ARN from an environment input, and without this line
    # a dispatch from main emitted the subject `ref:refs/heads/main` -- which
    # prod's trust policy used to accept. So verifying prod handed out prod's
    # deploy role with no reviewer asked.
    #
    # The step comment below says "everything below is read-only", and that is
    # true of the STEPS. It was never true of the CREDENTIAL: the deploy role can
    # write this environment's SSM tree, tunnel to its database, and create and
    # delete the restore-drill instance. Describing the workload is not the same
    # as describing what was handed to it.
    #
    # Safe to declare here, unlike in db-migrate.yml, because this workflow has
    # no `pull_request` trigger -- so there is no PR-branch run for a deployment
    # branch policy to refuse.
    #
    # The rule this establishes: any workflow that interpolates an environment
    # into a role ARN must declare that environment.
    environment: ${{ github.event.inputs.environment || 'prod' }}

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the repository is bootstrapped
        env:
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::AWS_ACCOUNT_ID is not set. Run ./scripts/bootstrap-github.sh."
            exit 1
          fi

      # The scoped deploy role. Everything below is read-only; a scheduled job
      # has no business holding a credential that can change anything.
      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/fanosbingo-${{ github.event.inputs.environment || 'prod' }}-github-deploy
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: verify-${{ github.run_id }}

      # --- the three assertions, each independent -------------------------

      - name: Security detections fire, and stay quiet
        id: detections
        continue-on-error: true
        run: ./scripts/verify-detections.sh

      - name: Cloudflare settings Terraform cannot enforce
        id: cloudflare
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ZONE_ID}" ]; then
            echo "::warning::Cloudflare is not configured, so its settings are unverified. This is the one place Bot Fight Mode would be caught."
            exit 0
          fi
          ./scripts/verify-cloudflare.sh

      # The app and the API are on different origins, so every call the Mini App
      # makes is cross-origin and depends on this header matching exactly.
      #
      # A mismatch fails in the quietest possible way: the OPTIONS preflight
      # answers 204, the access log fills with apparently successful requests,
      # and the POST that matters is never sent by the browser at all. It looked
      # like 41 successful auth calls and zero logins.
      - name: The API allows the app's origin
        id: cors
        continue-on-error: true
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
        run: |
          set -uo pipefail
          APP_ORIGIN="https://app.${DOMAIN_NAME}"

          ALLOWED="$(curl -sSI -X OPTIONS "https://api.${DOMAIN_NAME}/functions/v1/auth/telegram" \
            -H "Origin: ${APP_ORIGIN}" \
            -H "Access-Control-Request-Method: POST" 2>/dev/null \
            | grep -i '^access-control-allow-origin:' | tr -d '\r' | awk '{print $2}')"

          if [ "$ALLOWED" = "$APP_ORIGIN" ]; then
            echo "  PASS  the API allows ${APP_ORIGIN}"
            exit 0
          fi

          echo "::error::CORS mismatch. The app is served from ${APP_ORIGIN}, but the API allows '${ALLOWED:-nothing}'."
          echo "::error::Browsers will complete the preflight and then refuse to send the request. Check ALLOWED_ORIGIN on the functions service."
          exit 1

      # An alarm that cannot fire is not coverage.
      #
      # verify-detections.sh above proves the metric FILTERS still match. This
      # proves the ALARMS still have somewhere to send to, and -- the part that
      # is genuinely silent -- that their metrics are still publishing at all.
      #
      # An alarm sitting at OK with no datapoints looks identical to a healthy
      # one from the console, and with treat_missing_data=notBreaching it will
      # never say otherwise. That is how a deposit alarm was created, a deposit
      # sat pending for a day, and no email arrived.
      - name: Alarms have a recipient, and a live metric
        id: alarms
        continue-on-error: true
        run: |
          ./scripts/verify-alarms.sh "$ENVIRONMENT"

          # The account-wide detections too. They are prefixed `fanosbingo-`
          # with no environment segment, so the environment run does not see
          # them -- and they are the kms:Sign and root-usage alarms, which are
          # the two whose silence matters most.
          #
          # Their metrics are event-driven, so the script asserts delivery only:
          # no datapoints is the goal, and verify-detections.sh above is what
          # proves the filters still match.
          ./scripts/verify-alarms.sh account

      - name: Nothing is exposed anonymously
        id: probe
        continue-on-error: true
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
        run: ./scripts/probe-public-access.sh "https://api.${DOMAIN_NAME}"

      # --- verdict --------------------------------------------------------
      #
      # continue-on-error above means the job would otherwise report success
      # regardless of what the checks found. This step is what makes the run's
      # status mean something.
      - name: Verdict
        run: |
          set -uo pipefail

          detections="${{ steps.detections.outcome }}"
          cloudflare="${{ steps.cloudflare.outcome }}"
          cors="${{ steps.cors.outcome }}"
          alarms="${{ steps.alarms.outcome }}"
          probe="${{ steps.probe.outcome }}"

          icon() { [ "$1" = "success" ] && echo "pass" || echo "**FAIL**"; }

          {
            echo "### Control verification — ${ENVIRONMENT}"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Security detections (kms:Sign, root usage) | $(icon "$detections") |"
            echo "| Cloudflare settings (Bot Fight Mode, SSL, proxy) | $(icon "$cloudflare") |"
            echo "| API allows the app's origin | $(icon "$cors") |"
            echo "| Alarms can reach a human, metrics are live | $(icon "$alarms") |"
            echo "| Anonymous access probe | $(icon "$probe") |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for r in "$detections" "$cloudflare" "$cors" "$alarms" "$probe"; do
            [ "$r" = "success" ] || failed=$((failed + 1))
          done

          if [ "$failed" -ne 0 ]; then
            {
              echo
              echo "${failed} check(s) failed. These are assertions about controls that"
              echo "are supposed to be protecting real money — treat a failure here as"
              echo "a live gap, not a flaky test."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${failed} control verification(s) failed."
            exit 1
          fi

          echo "::notice::All controls verified."
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "All controls verified." >> "$GITHUB_STEP_SUMMARY"
