name: Terraform

# Infrastructure changes reach AWS through exactly one path: this workflow.
#
#   Pull request  -> validate, security-scan, plan dev, comment the plan on the PR
#   Merge to main -> plan + apply prod, gated by the `prod` GitHub Environment
#                    AND by the PROD_APPLY_ENABLED repository variable
#   Manual        -> plan / apply / destroy any environment on demand
#
# Dev is deliberately NOT applied on merge. The reason USED TO BE that it is
# on-demand infrastructure, stood up to test something and destroyed afterwards.
# That is no longer what dev is: prod has never been applied, and dev is what
# api.<domain> resolves to and what holds real player balances. So the reason is
# now the stronger one -- an unreviewed merge should not roll straight onto the
# environment players are using.
#
# The destroy job's guards were written around the old assumption and have been
# corrected; see the comment there. Until cutover, read every "dev" below as
# "the live environment".
#
# `account` is the third root: CloudTrail and the account-wide guardrails. It is
# a singleton, applied on demand, and never targeted by a merge.
#
# AUTHENTICATION is OIDC, and it uses TWO roles rather than one.
#
#   plan on a pull request -> AWS_PLANNER_ROLE_ARN, read-only
#   everything else        -> AWS_ROLE_ARN, AdministratorAccess
#
# A pull request runs workflow code taken from the PR branch. Handing that an
# admin role means a modified workflow file is an admin credential; the planner
# role removes the reliance on GitHub's fork defaults being the only thing in
# the way. See scripts/bootstrap-aws.sh for the trust policies.
#
# There is no AWS access key stored in this repository.

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to act on'
        required: true
        type: choice
        options: [dev, prod, account]
        default: dev
      action:
        description: 'What to do'
        required: true
        type: choice
        options: [plan, apply, destroy]
        default: plan
      confirm:
        description: 'destroy ONLY: type the environment name to confirm'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write        # request the OIDC token
  pull-requests: write   # comment the plan

env:
  TF_VERSION: '1.15.8'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'

jobs:
  # ==========================================================================
  # Resolve the target environment ONCE, so plan and apply can never disagree
  # about what they are acting on.
  # ==========================================================================
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      plan_environments: ${{ steps.target.outputs.plan_environments }}
      plan_role: ${{ steps.target.outputs.plan_role }}
    steps:
      - id: target
        env:
          EXECUTOR_ROLE: ${{ vars.AWS_ROLE_ARN }}
          PLANNER_ROLE: ${{ vars.AWS_PLANNER_ROLE_ARN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch) target="${{ github.event.inputs.environment }}" ;;
            push)              target="prod" ;;   # merge to main targets prod
            *)                 target="dev"  ;;   # PRs plan against dev
          esac

          # WHICH ROOTS A PULL REQUEST ACTUALLY PLANS.
          #
          # This used to be `dev`, unconditionally, for every pull request. So a
          # change to environments/prod or environments/account got a green
          # "Plan (dev)" that had reviewed none of it -- and the two pull
          # requests that added Object Lock to the account bucket and unblocked
          # prod's first apply both merged that way.
          #
          # That is worse than no plan. A plan named after an environment it did
          # not read is evidence of the wrong thing, and it is the shape of
          # evidence a reviewer trusts most.
          #
          # It also hid a real defect for as long as it existed: prod carried
          # backup_retention_period = 7, which the FREE account plan refuses at
          # APPLY time, not plan time. No amount of planning dev could have found
          # it -- but planning prod at least puts the root in front of somebody.
          #
          # A modules/ change affects EVERY root, so it plans all three. That is
          # the case this exists for: dev planning clean while prod does not is
          # precisely the divergence modules/app_stack was created to prevent,
          # and nothing was checking for it.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.number }}/files" \
              --jq '.[].filename')"

            envs=""
            for e in account dev prod; do
              if grep -q "^infra/environments/${e}/" <<<"$files"; then
                envs="${envs}${envs:+ }${e}"
              fi
            done

            # A shared module, or this workflow itself, reaches all of them.
            if grep -qE '^infra/modules/|^\.github/workflows/terraform\.yml$' <<<"$files"; then
              envs="account dev prod"
            fi

            # Nothing matched -- keep the old behaviour rather than planning
            # nothing, so a path filter that lets a run start always plans
            # something.
            envs="${envs:-dev}"
          else
            envs="$target"
          fi

          plan_environments="$(printf '%s\n' $envs | jq -R . | jq -sc .)"
          echo "plan_environments=$plan_environments" >> "$GITHUB_OUTPUT"
          echo "Planning: $plan_environments"

          # Pull requests plan with the read-only role. Anything else is either a
          # merge to main or an explicit dispatch, both of which are trusted
          # paths, and both of which may need to apply afterwards.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            plan_role="$PLANNER_ROLE"
            # An unset variable arrives as an empty string, and
            # configure-aws-credentials would then fail with an unhelpful
            # message about a missing role. Say what is actually wrong.
            if [ -z "$plan_role" ]; then
              echo "::error::AWS_PLANNER_ROLE_ARN is not set. Run scripts/bootstrap-github.sh, or re-run scripts/bootstrap-aws.sh to create the planner role."
              exit 1
            fi
          else
            plan_role="$EXECUTOR_ROLE"
          fi

          echo "environment=$target"  >> "$GITHUB_OUTPUT"
          echo "plan_role=$plan_role" >> "$GITHUB_OUTPUT"
          echo "Target environment: $target"
          echo "Plan role: $plan_role"

  # ==========================================================================
  # Static checks. Fast, and they need no AWS credentials at all.
  # ==========================================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive infra/

      - name: Validate every environment
        run: |
          for env_dir in infra/environments/*/; do
            [ -f "$env_dir/main.tf" ] || { echo "skipping $env_dir (no main.tf)"; continue; }
            echo "::group::validate $env_dir"
            # -backend=false: validation needs no state and no credentials.
            terraform -chdir="$env_dir" init -backend=false
            terraform -chdir="$env_dir" validate
            echo "::endgroup::"
          done

      - name: Security scan (infrastructure misconfiguration)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/
          severity: HIGH,CRITICAL
          exit-code: '1'
          # Accepted findings live in .trivyignore, each with its justification.
          # Anything not listed there fails the build.
          trivyignores: .trivyignore

      # Secret scanning over the WHOLE repository, not just infra/.
      #
      # Narrow scanning is how a live Telegram bot token sat in
      # supabase/migrations for months. Trivy's built-in ruleset also missed it
      # entirely, so trivy-secret.yaml adds rules for Telegram tokens and EVM
      # private keys -- the two credential shapes this repository has actually
      # leaked. Both rules were verified against synthetic bait; the private-key
      # rule is anchored to an adjacent identifier so it does not flag ordinary
      # 64-hex values such as migration checksums.
      - name: Security scan (secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: CRITICAL
          exit-code: '1'
          trivy-config: ''
        env:
          TRIVY_SECRET_CONFIG: trivy-secret.yaml
          TRIVY_SKIP_DIRS: node_modules,.git,dist

  # ==========================================================================
  # Plan
  # ==========================================================================
  plan:
    name: Plan (${{ matrix.environment }})
    needs: [resolve, validate]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.action != 'destroy'
    runs-on: ubuntu-latest

    # One job per root the change reaches. See resolve.
    #
    # fail-fast off, deliberately: the whole point is to see EVERY environment's
    # verdict. Cancelling prod's plan because account's failed would reintroduce
    # the blind spot in a different shape.
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.resolve.outputs.plan_environments) }}

    # NO `environment:` HERE, and it is load-bearing.
    #
    # A job that declares an environment gets `environment:<name>` as its OIDC
    # subject -- the environment context REPLACES the event context. So a plan
    # job on a pull request with `environment: dev` presents
    # `repo:owner/name:environment:dev`, never `...:pull_request`, and the
    # read-only planner role (which trusts `pull_request`) refuses it with a bare
    # "Not authorized to perform sts:AssumeRoleWithWebIdentity".
    #
    # Dropping the environment is what makes the subject `pull_request` on a PR
    # and `ref:refs/heads/main` otherwise, which is exactly the distinction the
    # two roles are scoped on. It also closes the hole the split was for: `dev`
    # carries a deployment branch policy restricting it to `main`, so a modified
    # workflow on a PR branch cannot declare `environment: dev` to reach the
    # admin executor.
    #
    # Consequence, accepted: `plan` dispatched from a branch other than main is
    # refused. Applies already required main or a protected environment.
    env:
      TF_DIR: infra/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Read-only on pull requests, admin on trusted paths. See the header.
      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.resolve.outputs.plan_role }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: tf-plan-${{ github.run_id }}

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_alert_emails: '["${{ vars.ALERT_EMAIL }}"]'
          # A SECOND alerting channel, so "a player is owed money" is not an
          # email and nothing else.
          #
          # A SECRET rather than a variable, though nothing about a phone number
          # is confidential in the way a token is: GitHub masks secrets in job
          # logs and does not mask variables, and this value would otherwise be
          # echoed in plaintext by every plan that touches the monitoring module.
          # Personal data in a build log is a poor default even in a private repo.
          #
          # A REPOSITORY secret, not an environment one. The plan job deliberately
          # declares no environment (see the comment on that job), so an
          # environment-scoped secret would arrive empty there and every plan
          # would show the SMS subscription being destroyed.
          #
          # The conditional matters. An unset secret interpolates as the empty
          # string, so the obvious '["${{ secrets.X }}"]' yields '[""]' -- a list
          # containing one empty string, which fails the E.164 validation in
          # modules/monitoring and takes the whole plan with it. Unset must mean
          # an EMPTY LIST, not a list of nothing.
          TF_VAR_alert_sms_numbers: ${{ secrets.ALERT_SMS_NUMBERS && format('["{0}"]', secrets.ALERT_SMS_NUMBERS) || '[]' }}
          # Where alarms actually land. SMS does not deliver on this account --
          # AWS End User Messaging is not enrolled, so SNS accepts the
          # subscription and drops every message. See modules/monitoring.
          #
          # A secret for the same reason the number is: GitHub masks secrets in
          # job logs and does not mask variables, and a chat id identifies a
          # person. Unset is fine and means "verify, then do not forward".
          TF_VAR_telegram_alert_chat_id: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Legacy fallback only. Which build runs is read from SSM at
          # /fanosbingo-<env>/images/<service>, written by the deploy workflow.
          # These variables are environment-scoped, so they are EMPTY on the plan
          # job (which declares no environment -- see the comment on the job) and
          # that is fine: SSM is the source of truth.
          TF_VAR_ticker_image: ${{ vars.TICKER_IMAGE }}
          TF_VAR_postgrest_image: ${{ vars.POSTGREST_IMAGE }}
          TF_VAR_realtime_image: ${{ vars.REALTIME_IMAGE }}
          TF_VAR_caddy_image: ${{ vars.CADDY_IMAGE }}
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present.
          # Say the verdict OUT LOUD, in the log.
          #
          # The plan output goes to plan.txt, and from there to the step summary
          # and a PR comment. A workflow_dispatch run has neither, so "did this
          # plan find anything?" was invisible in the one place you look first --
          # the job log -- and the step's green tick means only that terraform
          # exited cleanly, not that infrastructure matches the configuration.
          case $code in
            0)
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "::notice::No changes. Infrastructure matches the configuration."
              ;;
            2)
              echo "has_changes=true"  >> "$GITHUB_OUTPUT"
              echo "::notice::Changes are pending. See the run summary for the plan."
              grep -E "^Plan: " plan.txt || true
              ;;
            *) cat plan.txt; exit 1 ;;
          esac
          # PR comments cap out around 65k characters.
          tail -c 60000 plan.txt > plan-truncated.txt

      - name: Summarise plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo "### Plan — ${{ matrix.environment }}"
            echo
            echo '```terraform'
            tail -c 40000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          TF_DIR: ${{ env.TF_DIR }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(`${process.env.TF_DIR}/plan-truncated.txt`, 'utf8');
            const changed = '${{ steps.plan.outputs.has_changes }}' === 'true';

            // A MARKER PER ENVIRONMENT, because this job is now a matrix.
            //
            // The lookup below used to match on the literal '### Terraform
            // plan', which was unique while exactly one plan ran. With three
            // matrix jobs commenting on one pull request, the first comment to
            // land is found and overwritten by whichever job finishes next --
            // so the pull request would end up showing one environment's plan
            // under whatever heading arrived last, and the other two would
            // vanish. Quietly, and looking entirely normal.
            const marker = `<!-- tf-plan:${{ matrix.environment }} -->`;

            const body = [
              marker,
              `### Terraform plan — \`${{ matrix.environment }}\``,
              '',
              changed
                ? 'Changes are pending.'
                : 'No changes. Infrastructure matches the configuration.',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '</details>',
            ].join('\n');

            // Update our previous comment rather than stacking one per push.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const mine = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

  # ==========================================================================
  # Apply
  #
  # Two independent gates on the merge-to-main path:
  #
  #   1. PROD_APPLY_ENABLED must be the string "true". Until you set it, merging
  #      infra changes plans but never applies. This exists because a missing
  #      GitHub Environment is created IMPLICITLY AND WITHOUT PROTECTION RULES —
  #      so relying on the environment alone would give you no gate at all until
  #      you had manually created it.
  #   2. The `prod` GitHub Environment's required reviewers.
  # ==========================================================================
  apply:
    name: Apply (${{ needs.resolve.outputs.environment }})
    needs: [resolve, plan]
    if: |
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       vars.PROD_APPLY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    concurrency:
      # Never let two applies touch one environment at once. State locking would
      # catch it, but failing here is clearer than a lock timeout.
      group: terraform-apply-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    env:
      TF_DIR: infra/environments/${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: tf-apply-${{ github.run_id }}

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # Re-plan rather than applying the artifact from the plan job: a saved plan
      # may reference a stale state serial by the time an approval lands.
      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_alert_emails: '["${{ vars.ALERT_EMAIL }}"]'
          # A SECOND alerting channel, so "a player is owed money" is not an
          # email and nothing else.
          #
          # A SECRET rather than a variable, though nothing about a phone number
          # is confidential in the way a token is: GitHub masks secrets in job
          # logs and does not mask variables, and this value would otherwise be
          # echoed in plaintext by every plan that touches the monitoring module.
          # Personal data in a build log is a poor default even in a private repo.
          #
          # A REPOSITORY secret, not an environment one. The plan job deliberately
          # declares no environment (see the comment on that job), so an
          # environment-scoped secret would arrive empty there and every plan
          # would show the SMS subscription being destroyed.
          #
          # The conditional matters. An unset secret interpolates as the empty
          # string, so the obvious '["${{ secrets.X }}"]' yields '[""]' -- a list
          # containing one empty string, which fails the E.164 validation in
          # modules/monitoring and takes the whole plan with it. Unset must mean
          # an EMPTY LIST, not a list of nothing.
          TF_VAR_alert_sms_numbers: ${{ secrets.ALERT_SMS_NUMBERS && format('["{0}"]', secrets.ALERT_SMS_NUMBERS) || '[]' }}
          # Where alarms actually land. SMS does not deliver on this account --
          # AWS End User Messaging is not enrolled, so SNS accepts the
          # subscription and drops every message. See modules/monitoring.
          #
          # A secret for the same reason the number is: GitHub masks secrets in
          # job logs and does not mask variables, and a chat id identifies a
          # person. Unset is fine and means "verify, then do not forward".
          TF_VAR_telegram_alert_chat_id: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Legacy fallback only. Which build runs is read from SSM at
          # /fanosbingo-<env>/images/<service>, written by the deploy workflow.
          # These variables are environment-scoped, so they are EMPTY on the plan
          # job (which declares no environment -- see the comment on the job) and
          # that is fine: SSM is the source of truth.
          TF_VAR_ticker_image: ${{ vars.TICKER_IMAGE }}
          TF_VAR_postgrest_image: ${{ vars.POSTGREST_IMAGE }}
          TF_VAR_realtime_image: ${{ vars.REALTIME_IMAGE }}
          TF_VAR_caddy_image: ${{ vars.CADDY_IMAGE }}
        run: terraform apply -auto-approve

      - name: Summarise outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo "### Applied — ${{ needs.resolve.outputs.environment }}"
            echo
            echo '```'
            terraform output 2>/dev/null || echo "(no outputs)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Operations Terraform cannot express as resources: rebooting RDS so the
      # static parameters it just wrote take effect, and publishing the
      # hot-wallet address derived from the KMS public key. Idempotent, so this
      # is a no-op on a steady-state apply.
      - name: Install dependencies for wallet derivation
        if: needs.resolve.outputs.environment != 'account'
        run: npm ci --omit=dev --ignore-scripts

      - name: Post-apply operations
        if: needs.resolve.outputs.environment != 'account'
        run: ./scripts/post-apply.sh ${{ needs.resolve.outputs.environment }}

      # A detector that has never seen a positive is not a detector. This tests
      # the DEPLOYED filter patterns against synthetic CloudTrail events, both
      # for firing on bait and for staying quiet on legitimate traffic. It never
      # calls kms:Sign -- see the script's header for why that matters.
      - name: Verify the security detections detect
        if: needs.resolve.outputs.environment == 'account'
        run: ./scripts/verify-detections.sh

  # ==========================================================================
  # Destroy. Manual only, and refuses prod outright.
  # ==========================================================================
  destroy:
    name: Destroy (${{ needs.resolve.outputs.environment }})
    needs: [resolve, validate]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    concurrency:
      group: terraform-apply-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    env:
      TF_DIR: infra/environments/${{ needs.resolve.outputs.environment }}
    steps:
      # ---------------------------------------------------------------------
      # THE ENVIRONMENT NAME IS NOT WHAT MAKES SOMETHING PRODUCTION.
      #
      # The two refusals below were written around an assumption that was true
      # when it was written and is not true now: that prod holds the money and
      # dev is scratch. Prod has never been applied -- the state bucket holds
      # `account/` and `dev/` and nothing else -- so the environment carrying
      # real player balances, and the one https://api.<domain> resolves to, is
      # DEV. It was the one environment this job would destroy without argument.
      #
      # That is a single dropdown selection away from ending the live game. RDS
      # deletion protection (see infra/environments/dev/main.tf) means the
      # database itself now survives, but `terraform destroy -auto-approve` does
      # not stop at the first failure in a useful way: the VPC, the Elastic IP,
      # the ECS cluster, the Cloudflare records and the ECR repositories (dev has
      # force_delete = true) all go, and what is left is a protected database
      # nothing can reach and a half-destroyed state file.
      #
      # So the guard is derived from the DATABASE rather than from a hardcoded
      # list of names. deletion_protection is the flag somebody sets when they
      # decide an environment holds something worth keeping, which makes it the
      # honest answer to "is this production" -- and it keeps being the honest
      # answer after a cutover renames which environment that is, without anyone
      # remembering to come back here.
      # ---------------------------------------------------------------------
      - name: Require the environment name to be typed
        env:
          TARGET: ${{ needs.resolve.outputs.environment }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$TARGET" ]; then
            echo "::error::Destroy not confirmed."
            echo "Selecting an environment from a dropdown is too easy to do by"
            echo "accident for an action that is not reversible. Re-run and type"
            echo "'$TARGET' into the confirm field."
            exit 1
          fi
          echo "Destroy of '$TARGET' confirmed by name."

      - name: Refuse to destroy prod
        if: needs.resolve.outputs.environment == 'prod'
        run: |
          echo "::error::Refusing to destroy prod from CI."
          echo "Prod is intended to hold player balances and a funded hot wallet."
          echo "If you genuinely mean to tear it down, do it deliberately from a"
          echo "workstation after taking a final snapshot and sweeping the wallet."
          exit 1

      - name: Refuse to destroy the account baseline
        if: needs.resolve.outputs.environment == 'account'
        run: |
          echo "::error::Refusing to destroy the account root from CI."
          echo "This root owns CloudTrail. Destroying it deletes the audit record of"
          echo "whatever destroyed it, which is the one outcome worth designing against."
          echo "The executor role is additionally denied cloudtrail:DeleteTrail, so this"
          echo "would fail partway through and leave the baseline half-applied."
          exit 1

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: tf-destroy-${{ github.run_id }}

      # The real gate. See the comment above the confirmation step for why this
      # asks the database rather than checking a list of environment names.
      #
      # THREE OUTCOMES, and the third is the one worth being careful about:
      #
      #   protected      refuse. Somebody decided this database holds something.
      #   not protected  proceed. This is a scratch environment.
      #   NO DATABASE    proceed, and say so. An environment that was never
      #                  applied, or is already partly torn down, has nothing to
      #                  protect -- and failing here would make a half-destroyed
      #                  environment impossible to finish cleaning up, which is
      #                  the state somebody is most likely to be in when they
      #                  reach for destroy.
      - name: Refuse to destroy an environment whose database is protected
        env:
          TARGET: ${{ needs.resolve.outputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          if [ "$TARGET" = "account" ]; then
            echo "The account root has no database; the refusal below covers it."
            exit 0
          fi

          DB_ID="fanosbingo-${TARGET}-pg"

          # `|| true` so a genuinely absent instance is distinguished from an API
          # failure: DBInstanceNotFound writes nothing to stdout and we proceed,
          # while a credential or throttling error is caught by the empty-output
          # check being paired with a non-empty stderr in the log.
          PROTECTED="$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_ID" \
            --query 'DBInstances[0].DeletionProtection' \
            --output text 2>/dev/null || true)"

          if [ -z "$PROTECTED" ] || [ "$PROTECTED" = "None" ]; then
            echo "No database found at $DB_ID. Nothing to protect; proceeding."
            exit 0
          fi

          if [ "$PROTECTED" = "True" ]; then
            echo "::error::Refusing to destroy '$TARGET': $DB_ID has deletion protection ON."
            echo ""
            echo "That flag is how an environment says it holds something worth keeping,"
            echo "and it is set on whichever environment is actually serving players --"
            echo "which is not always the one called prod. Destroying around a protected"
            echo "database does not spare the game: the VPC, the Elastic IP, the ECS"
            echo "cluster and the DNS records all go, and the database survives with"
            echo "nothing able to reach it."
            echo ""
            echo "If you genuinely mean this, turn deletion protection off as its own"
            echo "change, with its own plan and its own review, and run this again."
            exit 1
          fi

          echo "$DB_ID has deletion protection off. Treating '$TARGET' as scratch; proceeding."

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform destroy
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_alert_emails: '["${{ vars.ALERT_EMAIL }}"]'
          # A SECOND alerting channel, so "a player is owed money" is not an
          # email and nothing else.
          #
          # A SECRET rather than a variable, though nothing about a phone number
          # is confidential in the way a token is: GitHub masks secrets in job
          # logs and does not mask variables, and this value would otherwise be
          # echoed in plaintext by every plan that touches the monitoring module.
          # Personal data in a build log is a poor default even in a private repo.
          #
          # A REPOSITORY secret, not an environment one. The plan job deliberately
          # declares no environment (see the comment on that job), so an
          # environment-scoped secret would arrive empty there and every plan
          # would show the SMS subscription being destroyed.
          #
          # The conditional matters. An unset secret interpolates as the empty
          # string, so the obvious '["${{ secrets.X }}"]' yields '[""]' -- a list
          # containing one empty string, which fails the E.164 validation in
          # modules/monitoring and takes the whole plan with it. Unset must mean
          # an EMPTY LIST, not a list of nothing.
          TF_VAR_alert_sms_numbers: ${{ secrets.ALERT_SMS_NUMBERS && format('["{0}"]', secrets.ALERT_SMS_NUMBERS) || '[]' }}
          # Where alarms actually land. SMS does not deliver on this account --
          # AWS End User Messaging is not enrolled, so SNS accepts the
          # subscription and drops every message. See modules/monitoring.
          #
          # A secret for the same reason the number is: GitHub masks secrets in
          # job logs and does not mask variables, and a chat id identifies a
          # person. Unset is fine and means "verify, then do not forward".
          TF_VAR_telegram_alert_chat_id: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Legacy fallback only. Which build runs is read from SSM at
          # /fanosbingo-<env>/images/<service>, written by the deploy workflow.
          # These variables are environment-scoped, so they are EMPTY on the plan
          # job (which declares no environment -- see the comment on the job) and
          # that is fine: SSM is the source of truth.
          TF_VAR_ticker_image: ${{ vars.TICKER_IMAGE }}
          TF_VAR_postgrest_image: ${{ vars.POSTGREST_IMAGE }}
          TF_VAR_realtime_image: ${{ vars.REALTIME_IMAGE }}
          TF_VAR_caddy_image: ${{ vars.CADDY_IMAGE }}
        run: terraform destroy -auto-approve
